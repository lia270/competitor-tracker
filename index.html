<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>竞品调研看板 · 自动发帖 / 自动回复</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 9999px;
        border: 1px solid #e5e7eb;
        background: #fff;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
        color: #6b7280;
      }
      .chip:hover {
        background: #f3f4f6;
      }
      .chip.active {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .star {
        width: 12px;
        height: 12px;
        display: inline-block;
      }
      .price-btn {
        cursor: pointer;
        transition: all 0.15s;
        border: 1px dashed transparent;
        padding: 2px 6px;
        border-radius: 6px;
        margin: -2px -6px;
      }
      .price-btn:hover {
        background: #eff6ff;
        border-color: #93c5fd;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }
      #lightbox.open {
        display: flex;
      }
      #lightbox-content {
        background: #fff;
        border-radius: 12px;
        max-width: 1200px;
        max-height: 90vh;
        width: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      #lightbox-header {
        padding: 16px 20px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      #lightbox-img-wrap {
        overflow: auto;
        background: #f1f5f9;
        flex: 1;
      }
      #lightbox-img {
        display: block;
        width: 100%;
        height: auto;
      }
      #lightbox-close {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: #f1f5f9;
        border: none;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
        color: #475569;
      }
      #lightbox-close:hover {
        background: #e2e8f0;
      }
      .price-tier {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .price-tier:nth-child(odd) {
        background: #f8fafc;
      }
      .note-image {
        max-width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        margin: 4px 0;
        cursor: zoom-in;
      }
      .note-paste-zone {
        border: 2px dashed #cbd5e1;
        border-radius: 6px;
        padding: 12px;
        text-align: center;
        font-size: 11px;
        color: #64748b;
        margin-top: 6px;
        transition: all 0.15s;
      }
      .note-paste-zone.dragover {
        border-color: #3b82f6;
        background: #eff6ff;
      }
      #export-fab {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 50;
        background: #2563eb;
        color: white;
        padding: 12px 20px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        cursor: pointer;
        border: none;
        display: none;
      }
      #export-fab.show {
        display: block;
      }
      #export-fab:hover {
        background: #1d4ed8;
      }
      .self-host-badge {
        background: #fef3c7;
        border: 1px solid #fcd34d;
        color: #92400e;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 11px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <div id="root" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <p class="text-slate-500">载入中…</p>
    </div>

    <button id="export-fab" title="导出包含所有备注的 data.json">
      📦 导出更新（<span id="draft-count">0</span> 条草稿）
    </button>

    <div id="lightbox" role="dialog" aria-modal="true">
      <div id="lightbox-content">
        <div id="lightbox-header">
          <div>
            <div id="lightbox-title" class="font-semibold text-slate-900"></div>
            <a id="lightbox-source" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline"></a>
          </div>
          <button id="lightbox-close" aria-label="关闭">✕</button>
        </div>
        <div id="lightbox-img-wrap">
          <img id="lightbox-img" alt="官网定价截图" />
        </div>
      </div>
    </div>

    <script>
      const CAT_COLOR = {
        blue: "bg-blue-50 text-blue-700 border-blue-200",
        violet: "bg-violet-50 text-violet-700 border-violet-200",
        amber: "bg-amber-50 text-amber-700 border-amber-200",
      };

      const DRAFT_KEY = "competitor-tracker-drafts-v1";
      const state = {
        data: null,
        activeCat: "all",
        budgetOnly: false,
        recommendedOnly: false,
        editMode: false,
        drafts: loadDrafts(),
      };

      function loadDrafts() {
        try {
          return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}");
        } catch {
          return {};
        }
      }
      function saveDrafts() {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(state.drafts));
        const total = Object.values(state.drafts).reduce(
          (n, arr) => n + (arr ? arr.length : 0),
          0
        );
        document.getElementById("draft-count").textContent = total;
        document
          .getElementById("export-fab")
          .classList.toggle("show", total > 0);
      }
      function getDraftsFor(id) {
        return state.drafts[id] || [];
      }
      function addDraft(id, note) {
        if (!state.drafts[id]) state.drafts[id] = [];
        state.drafts[id].push(note);
        saveDrafts();
      }
      function removeDraft(id, index) {
        if (!state.drafts[id]) return;
        state.drafts[id].splice(index, 1);
        if (state.drafts[id].length === 0) delete state.drafts[id];
        saveDrafts();
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      function priceLabel(c) {
        return c.priceMin === c.priceMax
          ? `$${c.priceMin}`
          : `$${c.priceMin}–${c.priceMax}`;
      }

      function stars(n) {
        let html = "";
        for (let i = 0; i < 5; i++) {
          html +=
            i < n
              ? '<svg class="star" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"><polygon points="12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9"/></svg>'
              : '<svg class="star" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><polygon points="12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9"/></svg>';
        }
        return html;
      }

      function filtered() {
        return state.data.competitors.filter((c) => {
          if (state.activeCat !== "all" && c.category !== state.activeCat)
            return false;
          if (state.budgetOnly && !c.inBudget) return false;
          if (state.recommendedOnly && !c.recommended) return false;
          return true;
        });
      }

      function render() {
        const d = state.data;
        const stats = {
          total: d.competitors.length,
          inBudget: d.competitors.filter((c) => c.inBudget).length,
          recommended: d.competitors.filter((c) => c.recommended).length,
          withApi: d.competitors.filter((c) => c.hasApi).length,
        };
        const catMap = Object.fromEntries(d.categories.map((c) => [c.id, c]));
        const list = filtered();

        document.getElementById("root").innerHTML = `
          <header class="mb-10">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-sm font-medium text-blue-600">✨ Competitor Tracker</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900">
                  自动发帖 / 自动回复 选型看板
                </h1>
                <p class="mt-2 text-sm text-slate-600 max-w-2xl">
                  echo-app 收件箱第三方集成竞品调研。修改 <code class="px-1 bg-slate-200 rounded text-xs">data.json</code> 后刷新页面即可更新。
                </p>
              </div>
              <div class="text-xs text-slate-500 text-right">
                <div>📅 最后更新：${escapeHtml(d.lastUpdated)}</div>
                <div>👤 维护人：${escapeHtml(d.owner)}</div>
                <button id="edit-mode-toggle" class="mt-2 px-3 py-1.5 text-xs font-medium rounded-full border ${state.editMode ? "bg-blue-500 text-white border-blue-500" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"}">
                  ${state.editMode ? "✓ 编辑模式开启中" : "✏️ 开启编辑模式"}
                </button>
              </div>
            </div>
          </header>

          <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
            ${statCard("总竞品数", stats.total, "text-slate-900")}
            ${statCard("预算内 ($10–20)", stats.inBudget, "text-green-600")}
            ${statCard("推荐采用", stats.recommended, "text-blue-600")}
            ${statCard("提供 API", stats.withApi, "text-violet-600")}
          </section>

          <section class="mb-10">
            <h2 class="text-lg font-semibold mb-3 text-slate-900">✨ 三种决策方案</h2>
            <div class="grid md:grid-cols-3 gap-3">
              ${d.decisionPlans.map(planCard).join("")}
            </div>
          </section>

          <section class="flex flex-wrap items-center gap-2 mb-6">
            <span class="text-sm font-medium text-slate-600 mr-1">🔍 筛选：</span>
            ${chip("all", state.activeCat === "all", "全部分类", "cat")}
            ${d.categories
              .map((c) =>
                chip(c.id, state.activeCat === c.id, c.label, "cat")
              )
              .join("")}
            <span class="mx-2 h-4 w-px bg-slate-300"></span>
            ${chip("budget", state.budgetOnly, "💰 仅预算内", "budget")}
            ${chip("recommended", state.recommendedOnly, "⭐ 仅推荐", "recommended")}
            <span class="ml-auto text-xs text-slate-500">显示 ${list.length} / ${d.competitors.length}</span>
          </section>

          <section class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
            ${list.map((c) => competitorCard(c, catMap)).join("")}
          </section>

          <footer class="mt-12 rounded-lg border border-dashed border-slate-300 bg-slate-50 p-4 text-xs text-slate-600">
            <p class="font-medium text-slate-900">📌 数据更新方式</p>
            <p class="mt-1">${escapeHtml(d.note)}</p>
            <p class="mt-1">数据源：<code class="px-1 bg-slate-200 rounded font-mono">preview/competitor-tracker/data.json</code></p>
          </footer>
        `;

        bindEvents();
      }

      function statCard(label, value, color) {
        return `
          <div class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
            <div class="text-2xl font-bold tabular-nums ${color}">${value}</div>
            <div class="text-xs text-slate-500 mt-0.5">${label}</div>
          </div>
        `;
      }

      function planCard(p, i) {
        const highlight = i === 0;
        const totalLabel =
          "$" +
          p.monthlyCostMin +
          (p.monthlyCostMax !== p.monthlyCostMin ? "–" + p.monthlyCostMax : "") +
          "/月";
        return `
          <div class="rounded-lg border ${highlight ? "border-blue-400 ring-2 ring-blue-100" : "border-slate-200"} bg-white p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-semibold text-slate-900">方案 ${escapeHtml(p.id)} · ${escapeHtml(p.title)}</h3>
              ${highlight ? '<span class="text-[10px] px-2 py-0.5 bg-blue-500 text-white rounded-full">推荐</span>' : ""}
            </div>
            <div class="flex flex-wrap gap-1 mb-3">
              ${p.stack.map((s) => `<span class="text-[10px] px-2 py-0.5 border border-slate-300 rounded">${escapeHtml(s)}</span>`).join("")}
            </div>

            ${p.breakdown && p.breakdown.length ? `
              <div class="bg-slate-50 border border-slate-100 rounded p-2 mb-2 text-xs">
                <div class="text-[10px] font-semibold text-slate-500 mb-1">💰 价格构成</div>
                ${p.breakdown.map((b) => `
                  <div class="flex justify-between py-0.5">
                    <span class="text-slate-700">${escapeHtml(b.label)}</span>
                    <span class="font-semibold text-slate-900 tabular-nums">${escapeHtml(b.price)}</span>
                  </div>
                  ${b.note ? `<div class="text-[10px] text-slate-500 -mt-0.5 mb-1">${escapeHtml(b.note)}</div>` : ""}
                `).join("")}
                <div class="flex justify-between py-1 mt-1 border-t border-slate-200">
                  <span class="font-semibold text-slate-900">合计</span>
                  <span class="font-bold text-blue-600 tabular-nums">${totalLabel}</span>
                </div>
              </div>
            ` : ""}

            <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
              <span>⏱ ${p.timelineWeeks}周</span>
              <span>👷 ${escapeHtml(p.engineerDays)}人日</span>
            </div>
            <p class="text-xs text-slate-600 border-t border-slate-100 pt-2 leading-relaxed">${escapeHtml(p.fitFor)}</p>
          </div>
        `;
      }

      function chip(id, active, label, group) {
        return `<button class="chip ${active ? "active" : ""}" data-group="${group}" data-id="${escapeHtml(id)}">${label}</button>`;
      }

      function competitorCard(c, catMap) {
        const cat = catMap[c.category];
        const catColor = CAT_COLOR[cat?.color] || "bg-slate-50 text-slate-700 border-slate-200";
        return `
          <div class="relative rounded-lg border ${c.recommended ? "border-blue-400 shadow-md" : "border-slate-200"} bg-white p-5">
            ${c.recommended ? '<div class="absolute -top-2 right-4 text-[10px] px-2 py-0.5 bg-blue-500 text-white rounded-full font-semibold">推荐</div>' : ""}
            <div class="flex items-start justify-between mb-2">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-semibold text-lg text-slate-900">${escapeHtml(c.name)}</h3>
                  ${!c.inBudget ? '<span class="text-[10px] px-1.5 py-0.5 border border-red-300 text-red-600 rounded">超预算</span>' : ""}
                </div>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[10px] px-1.5 py-0.5 border rounded ${catColor}">${escapeHtml(cat?.label || "")}</span>
                  <span class="flex gap-0.5">${stars(c.rating)}</span>
                </div>
              </div>
              <div class="text-right">
                <button class="price-btn text-right" data-screenshot="${escapeHtml(c.screenshot || "")}" data-source="${escapeHtml(c.priceSource || c.website)}" data-name="${escapeHtml(c.name)}" title="点击查看官网定价截图">
                  <div class="text-xl font-bold tabular-nums text-slate-900">${priceLabel(c)} 📷</div>
                  <div class="text-[10px] text-slate-500">${escapeHtml(c.priceUnit)}</div>
                </button>
              </div>
            </div>

            <div class="flex items-center gap-2 text-xs mb-3">
              ${c.hasApi ? '<span class="text-green-600">✓</span>' : '<span class="text-red-500">✗</span>'}
              <span class="text-slate-500">API：</span>
              <span class="font-medium text-slate-900">${escapeHtml(c.apiType)}</span>
            </div>

            ${c.priceTiers && c.priceTiers.length ? `
              <div class="mb-3 border border-slate-100 rounded p-2 bg-slate-50/50">
                <div class="text-[10px] font-semibold text-slate-500 mb-1.5">💰 套餐明细</div>
                ${c.priceTiers.map((t) => `
                  <div class="price-tier">
                    <span class="font-medium text-slate-700">${escapeHtml(t.name)}</span>
                    <span class="text-slate-900 font-semibold">${escapeHtml(t.price)}</span>
                  </div>
                  ${t.note ? `<div class="text-[10px] text-slate-500 px-2 mb-1">${escapeHtml(t.note)}</div>` : ""}
                `).join("")}
              </div>
            ` : ""}

            <div class="flex flex-wrap gap-1 mb-3">
              ${c.platforms.slice(0, 6).map((p) => `<span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-700 rounded">${escapeHtml(p)}</span>`).join("")}
              ${c.platforms.length > 6 ? `<span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-700 rounded">+${c.platforms.length - 6}</span>` : ""}
            </div>

            <div class="grid grid-cols-2 gap-2 border-t border-slate-100 pt-3 text-xs">
              <div>
                <div class="font-semibold text-green-600 mb-1">✓ 优势</div>
                <ul class="space-y-0.5 text-slate-600">
                  ${c.pros.map((p) => `<li>· ${escapeHtml(p)}</li>`).join("")}
                </ul>
              </div>
              <div>
                <div class="font-semibold text-red-600 mb-1">✗ 风险</div>
                <ul class="space-y-0.5 text-slate-600">
                  ${c.cons.map((p) => `<li>· ${escapeHtml(p)}</li>`).join("")}
                </ul>
              </div>
            </div>

            ${c.notes ? `<p class="mt-3 px-2 py-1.5 text-xs italic text-slate-600 bg-slate-50 rounded">${escapeHtml(c.notes)}</p>` : ""}

            ${c.selfHostable && c.serverCostNote ? `
              <div class="self-host-badge">
                🖥️ <strong>自托管说明</strong>：${escapeHtml(c.serverCostNote)}
              </div>
            ` : ""}

            ${renderNotes(c)}

            <div class="flex gap-2 mt-3">
              <a href="${escapeHtml(c.website)}" target="_blank" rel="noopener" class="text-xs px-3 py-1 border border-slate-300 rounded hover:bg-slate-50">↗ 官网</a>
              ${c.docs && c.docs !== "—" ? `<a href="${escapeHtml(c.docs)}" target="_blank" rel="noopener" class="text-xs px-3 py-1 text-slate-600 hover:bg-slate-100 rounded">📖 API 文档</a>` : ""}
            </div>
          </div>
        `;
      }

      function renderNotes(c) {
        const saved = (c.userNotes || []).slice();
        const drafts = getDraftsFor(c.id);
        const hasContent = saved.length || drafts.length || state.editMode;
        if (!hasContent) return "";

        const renderNote = (n, opts) => `
          <div class="border-l-2 ${opts.draft ? "border-amber-400 bg-amber-50" : "border-blue-300 bg-blue-50"} pl-2 pr-2 py-1.5 text-xs my-1.5 rounded-r">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 whitespace-pre-wrap text-slate-800">${escapeHtml(n.text || "")}</div>
              ${opts.draft ? `<button class="text-red-500 hover:text-red-700 text-[10px]" data-act="remove-draft" data-id="${escapeHtml(c.id)}" data-idx="${opts.index}">删除</button>` : ""}
            </div>
            ${(n.images || []).map((img) => `<img class="note-image" src="${img}" />`).join("")}
            <div class="text-[10px] text-slate-500 mt-1">${opts.draft ? "🟡 草稿（未上线）" : "✅ 已上线"} · ${escapeHtml(n.createdAt || "")}</div>
          </div>
        `;

        return `
          <div class="mt-3 border-t border-slate-100 pt-2">
            <div class="text-[10px] font-semibold text-slate-500 mb-1">📝 备注</div>
            ${saved.map((n) => renderNote(n, { draft: false })).join("")}
            ${drafts.map((n, i) => renderNote(n, { draft: true, index: i })).join("")}
            ${state.editMode ? `
              <div class="mt-2">
                <textarea class="w-full text-xs border border-slate-200 rounded p-2 resize-y" rows="2" placeholder="输入备注内容…" data-id="${escapeHtml(c.id)}" data-role="note-text"></textarea>
                <div class="note-paste-zone" data-id="${escapeHtml(c.id)}" data-role="paste-zone">
                  在此粘贴 (⌘+V) 或拖入截图
                </div>
                <div class="flex gap-2 mt-1.5">
                  <button class="text-[11px] px-2.5 py-1 bg-blue-500 text-white rounded hover:bg-blue-600" data-act="add-note" data-id="${escapeHtml(c.id)}">💾 保存草稿</button>
                  <span class="text-[10px] text-slate-500 self-center" data-role="img-count" data-id="${escapeHtml(c.id)}">无图片</span>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }

      const pendingImages = {};

      function bindEvents() {
        document.querySelectorAll(".chip").forEach((el) => {
          el.addEventListener("click", () => {
            const group = el.dataset.group;
            const id = el.dataset.id;
            if (group === "cat") state.activeCat = id;
            else if (group === "budget") state.budgetOnly = !state.budgetOnly;
            else if (group === "recommended")
              state.recommendedOnly = !state.recommendedOnly;
            render();
          });
        });

        const editToggle = document.getElementById("edit-mode-toggle");
        if (editToggle) {
          editToggle.addEventListener("click", () => {
            state.editMode = !state.editMode;
            render();
          });
        }

        document.querySelectorAll('[data-act="add-note"]').forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            const ta = document.querySelector(
              `[data-role="note-text"][data-id="${id}"]`
            );
            const text = (ta?.value || "").trim();
            const imgs = pendingImages[id] || [];
            if (!text && imgs.length === 0) {
              alert("请输入文字或粘贴/拖入截图");
              return;
            }
            addDraft(id, {
              text,
              images: imgs,
              createdAt: new Date().toISOString().slice(0, 16).replace("T", " "),
            });
            pendingImages[id] = [];
            render();
          });
        });

        document.querySelectorAll('[data-act="remove-draft"]').forEach((btn) => {
          btn.addEventListener("click", () => {
            removeDraft(btn.dataset.id, parseInt(btn.dataset.idx, 10));
            render();
          });
        });

        document
          .querySelectorAll('[data-role="paste-zone"]')
          .forEach((zone) => {
            const id = zone.dataset.id;

            const handleFile = (file) => {
              if (!file || !file.type.startsWith("image/")) return;
              const reader = new FileReader();
              reader.onload = (e) => {
                if (!pendingImages[id]) pendingImages[id] = [];
                pendingImages[id].push(e.target.result);
                const counter = document.querySelector(
                  `[data-role="img-count"][data-id="${id}"]`
                );
                if (counter)
                  counter.textContent = `📎 ${pendingImages[id].length} 张图片待保存`;
              };
              reader.readAsDataURL(file);
            };

            zone.addEventListener("paste", (e) => {
              const items = e.clipboardData?.items || [];
              for (const it of items) {
                if (it.type.startsWith("image/")) {
                  handleFile(it.getAsFile());
                  e.preventDefault();
                }
              }
            });
            zone.tabIndex = 0;
            zone.addEventListener("dragover", (e) => {
              e.preventDefault();
              zone.classList.add("dragover");
            });
            zone.addEventListener("dragleave", () => {
              zone.classList.remove("dragover");
            });
            zone.addEventListener("drop", (e) => {
              e.preventDefault();
              zone.classList.remove("dragover");
              for (const f of e.dataTransfer.files) handleFile(f);
            });
          });

        document.querySelectorAll(".price-btn").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.preventDefault();
            const screenshot = el.dataset.screenshot;
            const source = el.dataset.source;
            const name = el.dataset.name;
            if (!screenshot) {
              window.open(source, "_blank");
              return;
            }
            document.getElementById("lightbox-title").textContent =
              name + " · 官网定价截图";
            const a = document.getElementById("lightbox-source");
            a.href = source;
            a.textContent = "↗ " + source;
            document.getElementById("lightbox-img").src = screenshot;
            document.getElementById("lightbox").classList.add("open");
          });
        });
      }

      function exportData() {
        const merged = JSON.parse(JSON.stringify(state.data));
        merged.lastUpdated = new Date().toISOString().slice(0, 10);
        for (const c of merged.competitors) {
          const drafts = state.drafts[c.id];
          if (drafts && drafts.length) {
            c.userNotes = (c.userNotes || []).concat(drafts);
          }
        }
        const json = JSON.stringify(merged, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.json";
        a.click();
        URL.revokeObjectURL(url);

        const ok = confirm(
          "已下载 data.json！\n\n" +
            "下一步：\n" +
            "1. 把下载的 data.json 替换掉项目里的 preview/competitor-tracker/data.json\n" +
            "2. 跑命令：bash preview/competitor-tracker/deploy.sh\n" +
            "3. 1-2 分钟后线上即可看到\n\n" +
            "点击「确定」清空本地草稿（推荐已部署后再清）；点击「取消」保留草稿继续编辑。"
        );
        if (ok) {
          state.drafts = {};
          saveDrafts();
          render();
        }
      }

      document.getElementById("export-fab").addEventListener("click", exportData);

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
      }
      document
        .getElementById("lightbox-close")
        .addEventListener("click", closeLightbox);
      document.getElementById("lightbox").addEventListener("click", (e) => {
        if (e.target.id === "lightbox") closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      // 加载数据：fetch 失败（双击打开 file:// 时浏览器会拒绝）则降级到内嵌
      fetch("./data.json")
        .then((r) => {
          if (!r.ok) throw new Error("fetch failed");
          return r.json();
        })
        .then((data) => {
          state.data = data;
          render();
          saveDrafts();
        })
        .catch(() => {
          document.getElementById("root").innerHTML = `
            <div class="max-w-2xl mx-auto bg-amber-50 border border-amber-300 rounded-lg p-6 text-sm">
              <h2 class="font-semibold text-amber-900 mb-2">⚠️ 需要通过本地服务器打开</h2>
              <p class="text-amber-800 mb-3">
                直接双击 HTML 文件浏览器会因安全策略拒绝读取 <code>data.json</code>。请在终端进入此目录后执行：
              </p>
              <pre class="bg-slate-900 text-slate-100 px-4 py-3 rounded text-xs overflow-x-auto">cd preview/competitor-tracker
python3 -m http.server 8765</pre>
              <p class="mt-3 text-amber-800">
                然后访问 <a href="http://localhost:8765" class="underline font-medium">http://localhost:8765</a>
              </p>
              <p class="mt-3 text-xs text-amber-700">
                或运行 <code>npx serve .</code> / <code>php -S localhost:8765</code> 任一即可。
              </p>
            </div>
          `;
        });
    </script>
  </body>
</html>
